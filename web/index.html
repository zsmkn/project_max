<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>車輛履歷系統</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
<header>
  <h1>基於區塊鏈技術的汽車履歷系統</h1>
  <p>請選擇角色介面（FFR1–FFR4，plan.md §5 階段 5）</p>
</header>
<main>
  <div class="card">
    <h2><a href="owner.html">車主介面</a></h2>
    <p class="muted">自持 PQC 金鑰（私鑰只存在你的瀏覽器）、簽署保養授權、產生買家查詢 QR Code、即時接收車況異動通知。</p>
  </div>
  <div class="card">
    <h2><a href="buyer.html">買家介面</a></h2>
    <p class="muted">掃描 QR Code，在自己的瀏覽器內以鏈上公鑰驗證車主授權，查詢可信的車輛履歷（UC-02）。</p>
  </div>
  <div class="card">
    <h2><a href="appraiser.html">鑑定師介面</a></h2>
    <p class="muted">提交實體複檢結果，里程倒退時紅字警示並鎖定送出（UC-01）。</p>
  </div>
</main>
</body>
</html>
